services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kafu
      POSTGRES_PASSWORD: kafu
      POSTGRES_DB: kafu
    ports:
      - "5445:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kafu"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
