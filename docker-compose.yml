services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kafu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kafu}
      POSTGRES_DB: ${POSTGRES_DB:-kafu}
    ports:
      - "${DB_PORT:-5445}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kafu}"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3011}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kafu}:${POSTGRES_PASSWORD:-kafu}@db:5432/${POSTGRES_DB:-kafu}
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-secret-change-me}
      AUTH_TRUST_HOST: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
